name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - zj
      - codex/**

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest reflex

      - name: Run pytest
        run: pytest -q

      - name: Run public Docker smoke test
        timeout-minutes: 20
        run: bash scripts/ci_public_smoke.sh

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
